<!DOCTYPE html>
<html lang="id" data-icon-style="material" data-button-style="rounded" data-card-style="modern">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal Website Resmi Sekolah - Informasi PPDB, berita kegiatan, agenda akademik, galeri, dan profil sekolah." />
    <meta name="keywords" content="sekolah, portal sekolah, website sekolah, madrasah, sma, smk, smp, ppdb, pendidikan" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Portal Sekolah" />
    <meta name="theme-color" content="#22c55e" />

    <!-- Theme initialization script (runs before paint) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('ma_settings_cache_v1') || localStorage.getItem('sekolah_settings_cache');
          if (raw) {
            var parsed = JSON.parse(raw);
            var id = parsed && (parsed.schoolIdentity || parsed['schoolIdentity']);
            if (id) {
              if (id.iconStyle) document.documentElement.setAttribute('data-icon-style', id.iconStyle);
              if (id.buttonStyle) document.documentElement.setAttribute('data-button-style', id.buttonStyle);
              if (id.cardStyle) document.documentElement.setAttribute('data-card-style', id.cardStyle);
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="Portal Sekolah - Website Resmi" />
    <meta property="og:description" content="Portal Website Resmi Sekolah - Informasi PPDB, berita kegiatan, agenda akademik, dan profil." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Portal Sekolah" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portal Sekolah - Website Resmi" />
    <meta name="twitter:description" content="Portal Website Resmi Sekolah - Informasi PPDB, berita kegiatan, agenda akademik, dan profil." />

    <title>Portal Sekolah - Website Resmi</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" id="app-favicon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
